name: Dependency security audit

on:
  push:
    paths:
      - Cargo.lock
      - requirements.lock
      - .github/scripts/check_dependencies.py
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: '13 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check locked dependencies against OSV
        run: python3 .github/scripts/check_dependencies.py
